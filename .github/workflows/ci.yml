name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Tests run straight from the TypeScript sources via Node's type stripping,
  # which needs Node 22.6+. That is a constraint on developing this project,
  # not on running it.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: node --experimental-strip-types --test test/*.test.ts
      - name: Build
        run: npm run build
      - name: Server answers an MCP tools/list
        run: node .github/scripts/smoke.mjs

  # The published artifact is compiled JavaScript, so it runs on Node 20 even
  # though the test harness cannot. This job proves that claim rather than
  # leaving engines.node >=20 as an assertion nobody checks.
  runtime-node20:
    name: built server runs on node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - run: npm ci
      - name: Build
        run: npm run build
      - name: Server answers an MCP tools/list
        run: node .github/scripts/smoke.mjs
